[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buy-or-wait-price-intel"
version = "0.1.0"
description = "Deterministic price-intelligence prototype for Buy or Wait?"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "pydantic>=2.7,<3",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27,<1",
    "cryptography>=42,<46",
    "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
