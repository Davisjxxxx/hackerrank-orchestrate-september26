name: Apply final Codex contract patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-canonical-contract.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and verify contract patch
        shell: bash
        run: |
          python tools/patch_contract.py
          grep -F 'financial_events.direction is exactly within {debit, credit, non_cash}' CODEX_IMPLEMENTATION_CONTRACT_FINAL.md
          grep -F '### 4.1.1 Connector-ready ingestion boundary' CODEX_IMPLEMENTATION_CONTRACT_FINAL.md
          grep -F 'direction=non_cash is a valid canonical direction' CODEX_IMPLEMENTATION_CONTRACT_FINAL.md
          grep -F 'test_non_cash_investment_excluded_from_cash_flow.py' CODEX_IMPLEMENTATION_CONTRACT_FINAL.md
          grep -F 'test_adapter_boundary_source_agnostic.py' CODEX_IMPLEMENTATION_CONTRACT_FINAL.md

      - name: Remove bootstrap artifacts and commit canonical contract
        shell: bash
        run: |
          rm -f tools/patch_contract.py
          rm -f tools/contract_payload_part1.b64 tools/contract_payload_part2.b64 tools/contract_payload_part3.b64
          rm -f .github/workflows/patch-canonical-contract.yml
          rm -f .github/workflows/apply-contract-patch.yml
          rmdir tools 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix non-cash handling and add connector-ready ingestion boundary'
          git push origin HEAD:main
